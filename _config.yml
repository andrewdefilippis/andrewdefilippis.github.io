# Site settings. Everything about *you* (name, links, status) lives in _data/profile.yml.

title: Andrew DeFilippis
description: >-
  Andrew DeFilippis is a Systems Development Engineer with 11 years at AWS,
  focused on cloud infrastructure, automation, reliability, and AI-assisted engineering.
url: 'https://www.andrewdefilippis.com'
baseurl: ''
lang: en
timezone: America/Los_Angeles

# Search Console ownership check (a plain <meta> tag, no script).
google_site_verification: m5k6tmy7KJfG_Mlt89tQUpDfJGnl0rLjw4168ovoLuw

# Site colors. Options are the files in _includes/themes/: cerulean, navy, steel.
color_theme: cerulean

# Post header images are stored on the image server at:
#   <post_images><post file name without .md>/<image>.{avif,webp,png}
post_images: 'https://content.andrewdefilippis.com/images/posts/'

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

# Pages get folder-style URLs (/about/). Posts keep their existing /posts/<title>/ URLs.
permalink: pretty

defaults:
  - scope:
      path: ''
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ''
    values:
      layout: page

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - '*.iml'
  - 'did_*.txt'
  - .idea
  - .devcontainer
  - .ruby-lsp
